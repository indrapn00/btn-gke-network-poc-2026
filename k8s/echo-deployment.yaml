apiVersion: apps/v1
kind: Deployment
metadata:
  name: btn-echo-app
  namespace: default
  labels:
    app: btn-echo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: btn-echo-app
  template:
    metadata:
      labels:
        app: btn-echo-app
    spec:
      containers:
        - name: echo-server
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import os
              import socket
              import urllib.request
              from urllib.parse import urlparse, parse_qs

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      parsed = urlparse(self.path)
                      qs = parse_qs(parsed.query)
                      if parsed.path == "/egress-test":
                          target = qs.get("target", ["http://192.168.1.10/"])[0]
                          try:
                              req = urllib.request.Request(target, headers={"X-BTN-Source-Pod": os.environ.get("POD_NAME", "")})
                              with urllib.request.urlopen(req, timeout=5) as resp:
                                  body = resp.read().decode("utf-8")
                                  try:
                                      remote_json = json.loads(body)
                                  except Exception:
                                      remote_json = body
                                  payload = {
                                      "status": "ok",
                                      "direction": "GKE-Pod-to-AliCloud-Egress",
                                      "target_url": target,
                                      "gke_pod_name": os.environ.get("POD_NAME"),
                                      "gke_pod_ip": os.environ.get("POD_IP"),
                                      "gke_node_name": os.environ.get("NODE_NAME"),
                                      "gke_node_ip": os.environ.get("NODE_IP"),
                                      "alicloud_response": remote_json
                                  }
                                  self.send_response(200)
                          except Exception as e:
                              payload = {
                                  "status": "error",
                                  "target_url": target,
                                  "error": str(e),
                                  "gke_pod_ip": os.environ.get("POD_IP"),
                                  "gke_node_ip": os.environ.get("NODE_IP"),
                              }
                              self.send_response(502)
                      else:
                          payload = {
                              "service": "BTN GKE Island-Mode HTTP Workload",
                              "direction": "AliCloud-to-GKE-ILB-Ingress",
                              "observed_client_ip": self.client_address[0],
                              "request_path": self.path,
                              "gke_pod_name": os.environ.get("POD_NAME"),
                              "gke_pod_namespace": os.environ.get("POD_NAMESPACE"),
                              "gke_pod_ip": os.environ.get("POD_IP"),
                              "gke_node_name": os.environ.get("NODE_NAME"),
                              "gke_node_ip": os.environ.get("NODE_IP"),
                              "hostname": socket.gethostname(),
                              "headers": dict(self.headers)
                          }
                          self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write((json.dumps(payload, indent=2) + "\n").encode("utf-8"))

              http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
